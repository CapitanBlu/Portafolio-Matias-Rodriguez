<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio | Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* --- VARIABLES DE ESTILO --- */
        :root {
            --bg-color: #0b0c10;       
            --card-bg: #1f2833;        
            --text-main: #f5f5f5;      
            --text-muted: #c5a1ff;     
            --accent: #00ffcc;         
            --border-glow: #1a1a24;    
        }

        /* --- ESTILOS GENERALES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- ENCABEZADO --- */
        header {
            width: 100%;
            max-width: 900px;
            margin-bottom: 60px;
            text-align: center;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
        }

        header h1 {
            font-size: 2.5rem;
            color: var(--text-main);
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
        }

        header p {
            color: var(--accent);
            font-size: 0.9rem;
            margin-top: 5px;
            margin-bottom: 15px;
        }

        header .header-socials {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        .portfolio-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 50px; 
        }

        /* --- TARJETAS DE PROYECTO --- */
        .project-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .project-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
        }

        .project-title {
            font-size: 1.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            color: var(--text-main);
            border-left: 4px solid var(--accent);
            padding-left: 15px;
        }

        .project-info {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 25px;
            padding-left: 19px;
            text-align: justify;
        }

        .project-media {
            width: 100%;
            border-radius: 6px;
            overflow: hidden;
            background-color: #000;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .project-media img, 
        .project-media video {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        .project-media img {
            cursor: zoom-in;
            transition: opacity 0.3s ease;
        }
        
        .project-media img:hover {
            opacity: 0.9;
        }

        /* --- SECCIÓN CONTACTO --- */
        .contact-section {
            width: 100%;
            max-width: 900px;
            margin-top: 60px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .contact-section h2 {
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            color: var(--text-main);
            border-left: 4px solid var(--accent);
            padding-left: 15px;
        }

        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent);
        }

        .contact-form input[type="text"],
        .contact-form input[type="email"],
        .contact-form textarea {
            background-color: #0b0c10;
            border: 1px solid var(--border-glow);
            border-radius: 4px;
            padding: 12px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .contact-form input:focus,
        .contact-form textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .submit-btn {
            background-color: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            align-self: flex-start;
        }

        .submit-btn:hover {
            background-color: var(--accent);
            color: #0b0c10;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }

        /* --- FOOTER --- */
        footer {
            margin-top: 80px;
            padding: 30px 20px;
            width: 100%;
            max-width: 900px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .social-links {
            display: flex;
            gap: 25px;
        }

        .social-icon {
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.6rem;
            transition: color 0.3s ease, text-shadow 0.3s ease, transform 0.3s ease;
            text-decoration: none;
        }

        .social-icon:hover {
            color: var(--accent);
            transform: translateY(-3px);
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.6), 0 0 20px rgba(0, 255, 204, 0.4);
        }

        .footer-text {
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }

        /* --- LIGHTBOX (VENTANA OSCURA) --- */
        .lightbox-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(11, 12, 16, 0.9); 
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            cursor: zoom-out;
        }

        .lightbox-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox-overlay img {
            max-width: 90%;
            max-height: 85%;
            object-fit: contain;
            border-radius: 6px;
            border: 1px solid var(--accent);
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.2);
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }

        .lightbox-overlay.active img {
            transform: scale(1);
        }
    </style>
</head>
<body>

    <header>
        <h1>Portafolio</h1>
        <p>Matías Rodríguez</p>
        
        <div class="header-socials social-links">
            <a href="https://www.linkedin.com/in/matias-rodriguez-2908a0262/" target="_blank" rel="noopener noreferrer" class="social-icon" title="LinkedIn">
                <i class="fa-brands fa-linkedin-in"></i>
            </a>
            <a href="https://x.com/Bluegamer89" target="_blank" rel="noopener noreferrer" class="social-icon" title="Twitter / X">
                <i class="fa-brands fa-x-twitter"></i>
            </a>
            <a href="https://www.instagram.com/matichi._89?igsh=MXhzNWh3OTk0dHB5aQ==" target="_blank" rel="noopener noreferrer" class="social-icon" title="Instagram">
                <i class="fa-brands fa-instagram"></i>
            </a>
        </div>
    </header>

    <main class="portfolio-container" id="projects-wrapper">
        </main>

    <section class="contact-section">
        <h2>Solicitud de Trabajo / Cotización</h2>
        <form class="contact-form" action="https://formspree.io/f/mjgzpjjn" method="POST">
            <div class="form-group">
                <label for="email">Tu Correo Electrónico</label>
                <input type="email" id="email" name="_replyto" placeholder="ejemplo@correo.com" required>
            </div>
            <div class="form-group">
                <label for="budget">Presupuesto Estimado (USD / CLP)</label>
                <input type="text" id="budget" name="presupuesto" placeholder="Ej: $500 USD o Detalles del presupuesto">
            </div>
            <div class="form-group">
                <label for="message">Detalles del Mensaje / Encargo</label>
                <textarea id="message" name="mensaje" rows="5" placeholder="Describe el encargo. Si tienes imágenes de referencia, puedes pegar aquí sus enlaces (Imgur, Google Drive, Discord, etc.)..." required></textarea>
            </div>
            <button type="submit" class="submit-btn">Enviar Solicitud</button>
        </form>
    </section>

    <footer>
        <div class="social-links">
            <a href="https://www.linkedin.com/in/matias-rodriguez-2908a0262/" target="_blank" rel="noopener noreferrer" class="social-icon" title="LinkedIn">
                <i class="fa-brands fa-linkedin-in"></i>
            </a>
            <a href="https://x.com/Bluegamer89" target="_blank" rel="noopener noreferrer" class="social-icon" title="Twitter / X">
                <i class="fa-brands fa-x-twitter"></i>
            </a>
            <a href="https://www.instagram.com/matichi._89?igsh=MXhzNWh3OTk0dHB5aQ==" target="_blank" rel="noopener noreferrer" class="social-icon" title="Instagram">
                <i class="fa-brands fa-instagram"></i>
            </a>
        </div>
        <p class="footer-text">© 2026 // Portafolio Matias Rodriguez</p>
    </footer>

    <div class="lightbox-overlay" id="lightbox">
        <img src="" alt="Vista ampliada">
    </div>

    <script>
        const wrapper = document.getElementById('projects-wrapper');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = lightbox.querySelector('img');

        // 1. Cargar datos del archivo proyectos.json
        fetch('proyectos.json')
            .then(response => response.json())
            .then(proyectos => {
                // Renderizar cada proyecto en el HTML
                proyectos.forEach(proy => {
                    const card = document.createElement('article');
                    card.className = 'project-card';

                    let mediaHtml = '';
                    if (proy.tipo === 'video') {
                        mediaHtml = `
                            <video controls loop muted>
                                <source src="${proy.archivo}" type="video/mp4">
                                Tu navegador no soporta el formato de video.
                            </video>
                        `;
                    } else {
                        mediaHtml = `<img src="${proy.archivo}" alt="${proy.titulo}">`;
                    }

                    card.innerHTML = `
                        <h2 class="project-title">${proy.titulo}</h2>
                        <div class="project-info">${proy.info}</div>
                        <div class="project-media">${mediaHtml}</div>
                    `;

                    wrapper.appendChild(card);
                });

                // 2. Activar el Lightbox para las imágenes recién creadas
                const images = document.querySelectorAll('.project-media img');
                images.forEach(img => {
                    img.addEventListener('click', () => {
                        lightboxImg.src = img.src;
                        lightboxImg.alt = img.alt;
                        lightbox.classList.add('active');
                    });
                });
            })
            .catch(error => console.error('Error cargando los proyectos:', error));

        // 3. Cerrar el lightbox al hacer click fuera
        lightbox.addEventListener('click', () => {
            lightbox.classList.remove('active');
            setTimeout(() => { lightboxImg.src = ''; }, 300);
        });
    </script>

</body>
</html>
