<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portafolio | Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* --- VARIABLES DE ESTILO --- */
        :root {
            --bg-color: #0b0c10;       
            --card-bg: #1f2833;        
            --text-main: #f5f5f5;      
            --text-muted: #c5a1ff;     
            --accent: #00ffcc;         
            --border-glow: #1a1a24;    
            --like-color: #ff3366;     
            --online-color: #00ff66;   
            --views-color: #00bcff;    
        }

        /* --- ESTILOS GENERALES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- ENCABEZADO --- */
        header {
            width: 100%;
            max-width: 900px;
            margin-bottom: 60px;
            text-align: center;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
        }

        header h1 {
            font-size: 2.5rem;
            color: var(--text-main);
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.3);
        }

        header p {
            color: var(--accent);
            font-size: 0.9rem;
            margin-top: 5px;
            margin-bottom: 15px;
        }

        header .header-socials {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
            margin-bottom: 20px; 
        }

        /* --- BOTONES DE CV --- */
        .cv-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .cv-btn {
            background: rgba(0, 255, 204, 0.03);
            border: 1px solid rgba(0, 255, 204, 0.3);
            color: var(--text-main);
            padding: 8px 16px;
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 1px;
            text-decoration: none;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        .cv-btn:hover {
            border-color: var(--accent);
            background: rgba(0, 255, 204, 0.1);
            color: var(--accent);
            box-shadow: 0 0 12px rgba(0, 255, 204, 0.2);
            transform: translateY(-2px);
        }

        /* Contenedor de Estadísticas en el Header */
        .stats-wrapper {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
        }

        .stat-box {
            font-size: 0.8rem;
            color: var(--text-main);
            padding: 6px 14px;
            border-radius: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .box-likes {
            background: rgba(255, 51, 102, 0.08);
            border: 1px solid var(--like-color);
            box-shadow: 0 0 10px rgba(255, 51, 102, 0.15);
        }
        .box-likes i { color: var(--like-color); }

        .box-views {
            background: rgba(0, 188, 255, 0.08);
            border: 1px solid var(--views-color);
            box-shadow: 0 0 10px rgba(0, 188, 255, 0.15);
        }
        .box-views i { color: var(--views-color); }

        .box-online {
            background: rgba(0, 255, 102, 0.08);
            border: 1px solid var(--online-color);
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.15);
        }
        .box-online i { 
            color: var(--online-color); 
            animation: pulse 1.8s infinite ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.15); opacity: 1; text-shadow: 0 0 8px var(--online-color); }
            100% { transform: scale(1); opacity: 0.6; }
        }

        /* --- CONTENEDOR PRINCIPAL --- */
        .portfolio-container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 50px; 
        }

        /* --- TARJETAS DE PROYECTO --- */
        .project-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .project-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
        }

        .project-header-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
            gap: 15px;
        }

        .project-title {
            font-size: 1.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-main);
            border-left: 4px solid var(--accent);
            padding-left: 15px;
        }

        .like-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main);
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-family: inherit;
            font-weight: bold;
            transition: all 0.2s ease;
            user-select: none;
            white-space: nowrap;
        }

        .like-btn i {
            transition: transform 0.2s ease;
        }

        .like-btn:hover {
            border-color: var(--like-color);
            background: rgba(255, 51, 102, 0.05);
            color: var(--like-color);
        }

        .like-btn:hover i {
            transform: scale(1.2);
        }

        .like-btn.liked {
            background: rgba(255, 51, 102, 0.2);
            border-color: var(--like-color);
            color: var(--like-color);
            box-shadow: 0 0 10px rgba(255, 51, 102, 0.2);
        }

        .project-info {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 25px;
            padding-left: 19px;
            text-align: justify;
        }

        .project-media {
            width: 100%;
            border-radius: 6px;
            overflow: hidden;
            background-color: #000;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .project-media img, 
        .project-media video {
            width: 100%;
            height: auto;
            display: block;
            object-fit: cover;
        }

        .project-media img {
            cursor: zoom-in;
            transition: opacity 0.3s ease;
        }
        
        .project-media img:hover {
            opacity: 0.9;
        }

        /* --- SECCIÓN CONTACTO --- */
        .contact-section {
            width: 100%;
            max-width: 900px;
            margin-top: 60px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-glow);
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .contact-section h2 {
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            color: var(--text-main);
            border-left: 4px solid var(--accent);
            padding-left: 15px;
        }

        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent);
        }

        .contact-form input[type="text"],
        .contact-form input[type="email"],
        .contact-form textarea {
            background-color: #0b0c10;
            border: 1px solid var(--border-glow);
            border-radius: 4px;
            padding: 12px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .contact-form input:focus,
        .contact-form textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .submit-btn {
            background-color: transparent;
            border: 2px solid var(--accent);
            color: var(--accent);
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            align-self: flex-start;
        }

        .submit-btn:hover {
            background-color: var(--accent);
            color: #0b0c10;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.4);
        }

        /* --- FOOTER --- */
        footer {
            margin-top: 80px;
            padding: 30px 20px;
            width: 100%;
            max-width: 900px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .social-links {
            display: flex;
            gap: 25px;
        }

        .social-icon {
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.6rem;
            transition: color 0.3s ease, text-shadow 0.3s ease, transform 0.3s ease;
            text-decoration: none;
        }

        .social-icon:hover {
            color: var(--accent);
            transform: translateY(-3px);
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.6), 0 0 20px rgba(0, 255, 204, 0.4);
        }

        .footer-text {
            color: rgba(255, 255, 255, 0.3);
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
        }

        /* --- LIGHTBOX --- */
        .lightbox-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(11, 12, 16, 0.9); 
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            cursor: zoom-out;
        }

        .lightbox-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox-overlay img {
            max-width: 90%;
            max-height: 85%;
            object-fit: contain;
            border-radius: 6px;
            border: 1px solid var(--accent);
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.2);
            transform: scale(0.95);
            transition: transform 0.3s ease;
        }

        .lightbox-overlay.active img {
            transform: scale(1);
        }
    </style>
</head>
<body>

    <header>

        <div class="header-socials social-links">

        <div class="social-links">
            <a href="https://www.linkedin.com/in/matias-rodriguez-2908a0262/" target="_blank" rel="noopener noreferrer" class="social-icon" title="LinkedIn">

    <div class="lightbox-overlay" id="lightbox">
        <img src="" alt="Vista ampliada">
    </div>

    <script>
        const wrapper = document.getElementById('projects-wrapper');
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = lightbox.querySelector('img');
        const globalCounterEl = document.getElementById('global-likes-counter');
        const globalViewsEl = document.getElementById('global-views-counter');
        const liveOnlineEl = document.getElementById('live-online-counter');

        const FIREBASE_DB_URL = "https://likes-portafolio-default-rtdb.firebaseio.com";
        const totalLikesMap = {};

        const sessionUserId = "user_" + Math.random().toString(36).substring(2, 11);

        function updateGlobalCounter() {
            let sum = 0;
            for (const key in totalLikesMap) {
                sum += totalLikesMap[key];
            }
            globalCounterEl.innerText = sum;
        }

        function initTrafficStats() {
            if (!sessionStorage.getItem('counted_visit')) {
                fetch(`${FIREBASE_DB_URL}/stats/views.json`)
                    .then(res => res.json())
                    .then(currentViews => {
                        let newViews = (currentViews || 0) + 1;
                        fetch(`${FIREBASE_DB_URL}/stats/views.json`, {
                            method: 'PUT',
                            body: JSON.stringify(newViews)
                        }).then(() => {
                            globalViewsEl.innerText = newViews;
                            sessionStorage.setItem('counted_visit', 'true');
                        });
                    });
            } else {
                fetch(`${FIREBASE_DB_URL}/stats/views.json`)
                    .then(res => res.json())
                    .then(views => { globalViewsEl.innerText = views || 0; });
            }

            function sendHeartbeat() {
                fetch(`${FIREBASE_DB_URL}/online/${sessionUserId}.json`, {
                    method: 'PUT',
                    body: JSON.stringify(Date.now())
                });
            }

            sendHeartbeat();
            setInterval(sendHeartbeat, 4000);

            function processOnlineUsers() {
                fetch(`${FIREBASE_DB_URL}/online.json`)
                    .then(res => res.json())
                    .then(onlineUsers => {
                        if (!onlineUsers) {
                            liveOnlineEl.innerText = 1;
                            return;
                        }

                        const now = Date.now();
                        let activeCount = 0;

                        Object.keys(onlineUsers).forEach(userId => {
                            const lastActiveTime = onlineUsers[userId];
                            if (now - lastActiveTime > 10000) {
                                fetch(`${FIREBASE_DB_URL}/online/${userId}.json`, { method: 'DELETE' });
                            } else {
                                activeCount++;
                            }
                        });

                        liveOnlineEl.innerText = activeCount > 0 ? activeCount : 1;
                    })
                    .catch(() => { liveOnlineEl.innerText = 1; });
            }

            setInterval(processOnlineUsers, 4000);
            processOnlineUsers();
        }

        fetch('proyectos.json')
            .then(response => response.json())
            .then(proyectos => {
                
                proyectos.forEach((proy) => {
                    const projectKey = proy.archivo.replace(/[^a-zA-Z0-9]/g, "_").toLowerCase();
                    const hasLiked = localStorage.getItem(`liked_${projectKey}`) === 'true';

                    const card = document.createElement('article');
                    card.className = 'project-card';

                    let mediaHtml = '';
                    if (proy.tipo === 'video') {
                        mediaHtml = `
                            <video controls loop muted>
                                <source src="${proy.archivo}" type="video/mp4">
                                Tu navegador no soporta el formato de video.
                            </video>
                        `;
                    } else {
                        mediaHtml = `<img src="${proy.archivo}" alt="${proy.titulo}">`;
                    }

                    card.innerHTML = `
                        <div class="project-header-row">
                            <h2 class="project-title">${proy.titulo}</h2>
                            <button class="like-btn ${hasLiked ? 'liked' : ''}" id="btn-${projectKey}">
                                <i class="${hasLiked ? 'fa-solid' : 'fa-regular'} fa-heart"></i> 
                                <span class="like-count" id="count-${projectKey}">0</span>
                            </button>
                        </div>
                        <div class="project-info">${proy.info}</div>
                        <div class="project-media">${mediaHtml}</div>
                    `;

                    wrapper.appendChild(card);

                    fetch(`${FIREBASE_DB_URL}/likes/${projectKey}.json`)
                        .then(res => res.json())
                        .then(value => {
                            const currentLikes = value || 0;
                            document.getElementById(`count-${projectKey}`).innerText = currentLikes;
                            totalLikesMap[projectKey] = currentLikes;
                            updateGlobalCounter();
                        })
                        .catch(() => {
                            totalLikesMap[projectKey] = 0;
                        });

                    const likeBtn = card.querySelector('.like-btn');
                    likeBtn.addEventListener('click', () => {
                        const isLiked = likeBtn.classList.contains('liked');
                        const currentLikes = totalLikesMap[projectKey] || 0;
                        let newLikes = isLiked ? currentLikes - 1 : currentLikes + 1;
                        if (newLikes < 0) newLikes = 0;

                        fetch(`${FIREBASE_DB_URL}/likes/${projectKey}.json`, {
                            method: 'PUT',
                            body: JSON.stringify(newLikes)
                        })
                        .then(res => res.json())
                        .then(savedValue => {
                            document.getElementById(`count-${projectKey}`).innerText = savedValue;
                            totalLikesMap[projectKey] = savedValue;
                            updateGlobalCounter();

                            if (!isLiked) {
                                likeBtn.classList.add('liked');
                                likeBtn.querySelector('i').className = "fa-solid fa-heart";
                                localStorage.setItem(`liked_${projectKey}`, 'true');
                            } else {
                                likeBtn.classList.remove('liked');
                                likeBtn.querySelector('i').className = "fa-regular fa-heart";
                                localStorage.removeItem(`liked_${projectKey}`);
                            }
                        });
                    });
                });

                const images = document.querySelectorAll('.project-media img');
                images.forEach(img => {
                    img.addEventListener('click', () => {
                        lightboxImg.src = img.src;
                        lightboxImg.alt = img.alt;
                        lightbox.classList.add('active');
                    });
                });

                initTrafficStats();
            })
            .catch(error => console.error('Error cargando los proyectos:', error));

        lightbox.addEventListener('click', () => {
            lightbox.classList.remove('active');
            setTimeout(() => { lightboxImg.src = ''; }, 300);
        });
    </script>

</body>
